services:
  - type: web
    name: laundari-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RESET_PHRASE
        sync: false
      - key: CORS_ORIGIN
        value: https://aizen-1862.github.io
